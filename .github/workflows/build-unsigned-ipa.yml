name: Build unsigned SFI IPA (MLKEM)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Libbox + SFI unsigned IPA
    runs-on: xcode-27
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout Apple client (submodule)
        run: git submodule update --init --recursive clients/apple

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false

      - name: Patch Go for iOS
        run: .github/patch_go_for_ios.sh

      - name: Build Libbox.xcframework (ios/arm64)
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          git tag v1.14.4 -f
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/Libbox.xcframework

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive SFI (unsigned)
        run: |-
          cd clients/apple
          xcodebuild archive -skipPackagePluginValidation \
            -scheme SFI -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |-
          cd clients/apple/build
          mkdir -p Payload
          cp -R SFI.xcarchive/Products/Applications/*.app Payload/
          ls Payload
          zip -qry SFI-mlkem-unsigned.ipa Payload
          ls -lh SFI-mlkem-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-mlkem-unsigned-ipa
          path: clients/apple/build/SFI-mlkem-unsigned.ipa
          compression-level: 1
