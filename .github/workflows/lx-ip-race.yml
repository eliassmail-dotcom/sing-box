name: LX verified TLS and REALITY IP race

on:
  push:
    branches:
      - feature/lx-reality-ip-race
    paths:
      - common/dialer/**
      - common/tls/**
      - option/outbound.go
      - protocol/vless/outbound.go
      - .github/workflows/lx-ip-race.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lx-real-ip-race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Use pinned LX Go toolchain
        id: go_pin
        run: echo "version=$(tr -d '[:space:]' < go.version | sed 's/^go//')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_pin.outputs.version }}
          cache: true
      - name: Format changed source
        run: |
          gofmt -w common/dialer/tcp_concurrent_lx.go common/dialer/tcp_concurrent_lx_test.go \
            common/dialer/verified_tcp_lx.go common/tls/verified_race_lx_test.go \
            common/tls/verified_reality_race_lx_test.go common/tls/client.go \
            common/dialer/resolve.go common/dialer/dialer.go option/outbound.go protocol/vless/outbound.go
      - name: Run dialer, TLS and VLESS tests with race detector
        run: |
          go test -race -count=1 -timeout=12m -ldflags '-checklinkname=0' \
            ./common/dialer/ ./common/tls/ ./option/ ./protocol/vless/
      - name: Test real REALITY server beats TLS decoy
        run: |
          go test -race -count=1 -timeout=8m -ldflags '-checklinkname=0' \
            -tags 'with_utls with_lx_command' \
            -run '^TestLXIPRaceRequiresActualREALITYAuthentication$' ./common/tls/
      - name: Build sing-box-LX native CLI
        run: |
          make -f Makefile.lx lx-build LX_OUTPUT=sing-box
          ./sing-box version
      - name: Commit gofmt after passing validation
        run: |
          if ! git diff --quiet -- common/dialer common/tls/client.go \
            common/tls/verified_race_lx_test.go common/tls/verified_reality_race_lx_test.go \
            option/outbound.go protocol/vless/outbound.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add common/dialer/tcp_concurrent_lx.go common/dialer/tcp_concurrent_lx_test.go \
              common/dialer/verified_tcp_lx.go common/tls/verified_race_lx_test.go \
              common/tls/verified_reality_race_lx_test.go common/tls/client.go \
              common/dialer/resolve.go common/dialer/dialer.go option/outbound.go protocol/vless/outbound.go
            git commit -m "style(lx): gofmt verified TLS and REALITY race"
            git push origin HEAD:feature/lx-reality-ip-race
          fi
