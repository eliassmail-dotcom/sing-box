name: Build SFI IPA (LX v1.14.4-lx.33, unsigned for GBox signing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Libbox + SFI unsigned IPA (LX)
    runs-on: xcode-27
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout (LX sources, no submodules yet)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Init submodules (Apple client from our fork, branch lx)
        run: |-
          git config submodule.clients/apple.url https://github.com/eliassmail-dotcom/sing-box-for-apple.git
          git submodule update --init --recursive
          git -C clients/apple checkout lx
          git -C clients/apple submodule update --init --recursive
          git -C clients/apple rev-parse HEAD

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false

      - name: Patch Go for iOS
        run: .github/patch_go_for_ios.sh

      - name: Build Libbox.xcframework (ios/arm64, with_clash_api via integration patch)
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          git tag v1.14.4-lx.33 -f
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/Libbox.xcframework

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive SFI (unsigned)
        run: |-
          cd clients/apple
          rm -rf build/SFI.xcarchive
          xcodebuild archive -skipPackagePluginValidation \
            -scheme SFI -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA (for GBox signing)
        run: |-
          cd clients/apple/build
          rm -rf Payload SFI-lx-v1-unsigned.ipa
          mkdir Payload
          cp -R SFI.xcarchive/Products/Applications/sing-box.app Payload/
          zip -qry SFI-lx-v1-unsigned.ipa Payload
          ls -lh SFI-lx-v1-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-lx-v1-unsigned-ipa
          path: clients/apple/build/SFI-lx-v1-unsigned.ipa
          compression-level: 1
