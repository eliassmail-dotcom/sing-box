name: iOS adaptive reliability - exact prepared source tests
run-name: iOS F1-F3 host QA on prepared merge (no IPA)
on:
  push:
    branches:
      - qa/ios-adaptive-test-758a0f37
permissions:
  contents: read
  actions: read
jobs:
  test-prepared:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      QA_TAGS: with_utls with_lx_command with_lx_chain with_lx_idle_suspend with_xhttp with_quic
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ff6dacaa9e9eae53375a23a6f0ae0ea02a8f7444
      - name: Retrieve exact prepared merge bundle from completed preparation
        uses: actions/download-artifact@v4
        with:
          name: ios-adaptive-prepared-source
          run-id: 45386589071
          github-token: ${{ github.token }}
          path: /tmp/ios-prepared-review
      - name: Check out exact prepared merge (do not re-run prepare-b38)
        shell: bash
        run: |
          set -euxo pipefail
          git bundle verify /tmp/ios-prepared-review/prepared.bundle
          git fetch /tmp/ios-prepared-review/prepared.bundle HEAD
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 8520a825a772e3baefb14a60b5d9c125d8599261
          git fetch origin refs/heads/qa/ios-adaptive-prepared-758a0f37
          test "$(git rev-parse FETCH_HEAD)" = aa30c68f0bb02ebd036bf2b597305b40b217abda
          git diff --exit-code HEAD FETCH_HEAD -- . ':(exclude).github/workflows/**'
          grep -q 'const adaptiveFragmentPreparedLx = true' common/tls/adaptive_fragment_lx.go
      - name: Init pinned core dependencies from the prepared gitlinks
        shell: bash
        run: |
          set -euxo pipefail
          git submodule sync --recursive -- submodules/
          git submodule update --init --recursive -- submodules/
          for dep in utls wireguard-go sing-tun gvisor; do
            test -f "submodules/$dep/go.mod"
            test "$(git -C "submodules/$dep" rev-parse HEAD)" = "$(git rev-parse "HEAD:submodules/$dep")"
          done
          git submodule status --recursive -- submodules/
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Compile prepared host source
        run: |
          go build -ldflags '-checklinkname=0' ./...
          go build -ldflags '-checklinkname=0' -tags "$QA_TAGS" ./common/tls/ ./protocol/vless/ ./protocol/chain/ ./transport/v2rayxhttp/ ./experimental/libbox/
      - name: Core regression and REALITY verification
        run: |
          go test -race -count=1 -timeout=12m -ldflags '-checklinkname=0' ./common/dialer/ ./common/urltest/ ./common/tls/ ./option/ ./protocol/group/ ./route/ ./protocol/vless/
          go test -race -count=1 -timeout=12m -ldflags '-checklinkname=0' -tags "$QA_TAGS" ./common/dialer/ ./common/urltest/ ./common/tls/ ./option/ ./protocol/group/ ./route/ ./protocol/vless/
      - name: Chain, XHTTP, Smart priority and startup regression
        run: |
          go test -race -count=1 -timeout=12m -ldflags '-checklinkname=0' -tags "$QA_TAGS" ./protocol/chain/ ./transport/v2rayxhttp/ ./experimental/libbox/
          go test -count=1 -timeout=8m -ldflags '-checklinkname=0' -tags "$QA_TAGS" ./protocol/vless/encryption/
          go vet -tags "$QA_TAGS" ./common/dialer/ ./common/urltest/ ./common/tls/ ./protocol/vless/ ./protocol/group/ ./route/
      - name: Explicit prepared F3 / real authentication / FinalMask gate
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -ldflags '-checklinkname=0' -tags "$QA_TAGS" -list 'Test(LXAdaptiveFragment|LXIPRaceRequiresActualREALITYAuthentication|LXFinalMask|LxRealityFinalMask)' ./common/tls/ | tee /tmp/ios-qa-tests
          grep -q '^TestLXAdaptiveFragmentConfigGate$' /tmp/ios-qa-tests
          grep -q '^TestLXAdaptiveFragmentCloneAndWire$' /tmp/ios-qa-tests
          grep -q '^TestLXIPRaceRequiresActualREALITYAuthentication$' /tmp/ios-qa-tests
          grep -Eq '^Test(LXFinalMask|LxRealityFinalMask)' /tmp/ios-qa-tests
          go test -race -count=1 -timeout=8m -ldflags '-checklinkname=0' -tags "$QA_TAGS" -run 'Test(LXAdaptiveFragment|LXIPRaceRequiresActualREALITYAuthentication|LXFinalMask|LxRealityFinalMask|LxRealityDirectHybridRecordFragmentCombinedFirstFlight)' ./common/tls/ ./option/
