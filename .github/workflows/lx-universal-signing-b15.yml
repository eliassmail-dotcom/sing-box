name: SFI LX universal re-sign b15 unsigned IPA
run-name: "LX iOS | Universal Signing + Config Studio | 1.14.9 (build 15) | unsigned IPA"

on:
  push:
    branches:
      - build/lx-universal-signing-b15-20261115
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest iOS IPA build per branch. Branch-scoped groups prevent
# a manual dispatch on the default branch cancelling feature-branch builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Libbox + SFI unsigned IPA (LX)
    runs-on: xcode-27
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout (LX sources, no submodules yet)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Init submodules (Apple client pinned to current LX features)
        run: |-
          git config submodule.clients/apple.url https://github.com/eliassmail-dotcom/sing-box-for-apple.git
          git submodule update --init --recursive
          git -C clients/apple fetch --no-tags origin build/lx-universal-resign-b15-20261115
          git -C clients/apple checkout --detach 323a48bbb307d90eaa96d0aff6bb1a16728a7694
          test "$(git -C clients/apple rev-parse HEAD)" = "323a48bbb307d90eaa96d0aff6bb1a16728a7694"
          git -C clients/apple submodule update --init --recursive
          git -C clients/apple rev-parse HEAD

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false

      - name: Patch Go for iOS
        run: .github/patch_go_for_ios.sh

      - name: Test LX adaptive health and Smart base-white priority
        run: |-
          go test ./protocol/group -run '^(TestLX|TestPriorityFallback_)' -count=1 -timeout=8m

      - name: Build Libbox.xcframework (ios/arm64 + simulator, with_clash_api via integration patch)
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          git tag v1.14.4-lx.33 -f
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64,iossimulator/arm64
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/Libbox.xcframework

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Dump CommandClientHandler protocol (diagnostic)
        run: |-
          grep -n -B2 -A20 'Protocol LibboxCommandClientHandlerProtocol' clients/apple/Libbox.xcframework/ios-arm64/Libbox.framework/Headers/Libbox.h || \
            grep -n -A20 'LibboxCommandClientHandlerProtocol' clients/apple/Libbox.xcframework/ios-arm64/Libbox.framework/Headers/Libbox.h | head -60

      - name: Resolve Swift packages into isolated build directory
        run: |
          cd clients/apple
          mkdir -p build/SourcePackages
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -scheme SFI -clonedSourcePackagesDirPath "$PWD/build/SourcePackages"; then
              exit 0
            fi
            echo "SwiftPM resolve attempt $attempt failed; retrying isolated checkout"
            sleep 5
          done
          exit 1

      # Test compilation is mandatory; running an iOS simulator is not.
      - name: Compile SFUnitTests without starting iOS Simulator
        run: |-
          cd clients/apple
          xcodebuild build-for-testing -skipPackagePluginValidation \
            -derivedDataPath "$PWD/build/TestDerivedData" \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -scheme SFI -configuration Debug \
            -only-testing:SFUnitTests \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=-

      - name: Verify portable-signing regression test was compiled
        run: |-
          test -f clients/apple/SFUnitTests/SigningCompatibilityTests.swift
          grep -q 'testReadsXMLAndDetectsDERSlot' clients/apple/SFUnitTests/SigningCompatibilityTests.swift
          grep -q 'testRejectsMalformedSuperblobCount' clients/apple/SFUnitTests/SigningCompatibilityTests.swift

      - name: Archive SFI (unsigned)
        run: |-
          cd clients/apple
          rm -rf build/SFI.xcarchive
          xcodebuild archive -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -scheme SFI -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA (for GBox signing)
        run: |-
          cd clients/apple/build
          rm -rf Payload SFI-lxpp-v1.14.9-b15-UniversalSigning-ConfigStudio-unsigned.ipa
          mkdir Payload
          cp -R SFI.xcarchive/Products/Applications/sing-box.app Payload/
          APP_INFO="Payload/sing-box.app/Info.plist"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")
          test "$APP_VERSION" = "1.14.9"
          test "$APP_BUILD" = "15"
          echo "Packaging sing-box lx++ $APP_VERSION ($APP_BUILD)"
          zip -qry SFI-lxpp-v1.14.9-b15-UniversalSigning-ConfigStudio-unsigned.ipa Payload
          ls -lh SFI-lxpp-v1.14.9-b15-UniversalSigning-ConfigStudio-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-lxpp-v1.14.9-b15-UniversalSigning-ConfigStudio-unsigned-ipa
          path: clients/apple/build/SFI-lxpp-v1.14.9-b15-UniversalSigning-ConfigStudio-unsigned.ipa
          compression-level: 1


      # iOS 27.2 may be unmounted on the GitHub Xcode 27 runner, causing
      # SIGBUS in simulator OS daemons. Upload IPA before optional simulator QA.
      - name: Attempt simulator SFUnitTests (non-gating runtime check)
        id: optional_simulator_tests
        continue-on-error: true
        run: |-
          cd clients/apple
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for runtime, devices in d['devices'].items():
              for x in devices:
                  if x.get('isAvailable') and x.get('name','').startswith('iPhone'):
                      print(x['udid']); raise SystemExit
          sys.exit(1)
          ")
          echo "Simulator UUID: $SIM"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          rm -rf build/LXTests.xcresult
          xcodebuild test-without-building -skipPackagePluginValidation \
            -derivedDataPath "$PWD/build/TestDerivedData" \
            -resultBundlePath "$PWD/build/LXTests.xcresult" \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -scheme SFI -configuration Debug \
            -only-testing:SFUnitTests \
            -destination "platform=iOS Simulator,id=$SIM" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=-

      - name: Upload optional simulator XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SFI-lx-b15-optional-test-results
          path: clients/apple/build/LXTests.xcresult
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 1

      - name: Report simulator test outcome
        if: always()
        run: |-
          if [ "${{ steps.optional_simulator_tests.outcome }}" != "success" ]; then
            echo "::warning::Simulator XCTest did not pass on this runner. IPA is compile-checked but NOT runtime-test-verified."
            echo "### QA caveat: simulator XCTest did not pass" >> "$GITHUB_STEP_SUMMARY"
            echo "Unsigned IPA was built; runner simulator was unavailable or tests failed. Inspect diagnostics before declaring GO." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Simulator XCTest: PASS" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload symbolication dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SFI-lxpp-v1.14.9-b15-dsyms
          path: clients/apple/build/SFI.xcarchive/dSYMs/
          if-no-files-found: ignore
          compression-level: 1
