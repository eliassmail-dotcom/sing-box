name: Build sing-box CLI (MLKEM, windows/amd64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: sing-box.exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false

      - name: Build CLI (with_utls)
        run: |
          go build -tags "with_utls,with_gvisor,with_quic,with_wireguard,with_clash_api" \
            -o sing-box.exe ./cmd/sing-box
          ./sing-box.exe version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-cli-windows
          path: sing-box.exe
          compression-level: 1
