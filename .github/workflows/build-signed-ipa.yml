name: Build signed SFI IPA (MLKEM)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Libbox + SFI signed IPA
    runs-on: xcode-27
    env:
      GOTOOLCHAIN: local
      SIGN_IDENTITY: "iPhone Distribution: Ibrahim Usta (AXSTP35NFJ)"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout Apple client (submodule, our fork)
        run: |-
          git config submodule.clients/apple.url https://github.com/eliassmail-dotcom/sing-box-for-apple.git
          git submodule update --init --recursive clients/apple
          git -C clients/apple checkout mlkem
          git -C clients/apple rev-parse HEAD

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false

      - name: Patch Go for iOS
        run: .github/patch_go_for_ios.sh

      - name: Build Libbox.xcframework (ios/arm64)
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          git tag v1.14.4 -f
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/Libbox.xcframework

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive SFI (unsigned)
        run: |-
          cd clients/apple
          rm -rf build/SFI.xcarchive
          xcodebuild archive -skipPackagePluginValidation \
            -scheme SFI -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Import signing certificate
        env:
          APPLE_DEV_P12: ${{ secrets.APPLE_DEV_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |-
          CERTIFICATE_PATH=$RUNNER_TEMP/AppleDistribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=build
          echo "secret b64 length: ${#APPLE_DEV_P12}"
          echo -n "$APPLE_DEV_P12" | openssl base64 -d -A -out "$CERTIFICATE_PATH"
          ls -l "$CERTIFICATE_PATH"
          md5 -q "$CERTIFICATE_PATH"
          openssl pkcs12 -info -in "$CERTIFICATE_PATH" -passin "pass:$P12_PASSWORD" -noout
          LEGACY_PATH=$RUNNER_TEMP/AppleDistribution.legacy.p12
          openssl pkcs12 -in "$CERTIFICATE_PATH" -passin "pass:$P12_PASSWORD" -passout "pass:$P12_PASSWORD" -export -out "$LEGACY_PATH" -name "Apple Distribution"
          openssl pkcs12 -info -in "$LEGACY_PATH" -passin "pass:$P12_PASSWORD" -noout
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$LEGACY_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning | grep -i distribution

      - name: Extract profile entitlements
        env:
          PROFILE_B64: ${{ secrets.PROFILE_B64 }}
        run: |-
          cd clients/apple
          echo -n "$PROFILE_B64" | openssl base64 -d -A -out build/profile.mobileprovision
          security cms -D -i build/profile.mobileprovision > build/profile.plist
          plutil -extract Entitlements xml1 -o build/Entitlements.plist build/profile.plist
          plutil -p build/Entitlements.plist | head -40

      - name: Sign app with profile entitlements
        run: |-
          cd clients/apple/build
          APP=SFI.xcarchive/Products/Applications/sing-box.app
          cp profile.mobileprovision "$APP/embedded.mobileprovision"
          echo "--- signing frameworks"
          for fw in "$APP/Frameworks/"*.framework; do
            codesign -f --timestamp=none -s "$SIGN_IDENTITY" "$fw"
          done
          echo "--- signing extensions"
          for ex in "$APP/PlugIns/"*.appex; do
            codesign -f --timestamp=none -s "$SIGN_IDENTITY" --entitlements Entitlements.plist "$ex"
          done
          echo "--- signing main app"
          codesign -f --timestamp=none -s "$SIGN_IDENTITY" --entitlements Entitlements.plist "$APP"
          codesign -vv "$APP"

      - name: Package signed IPA
        run: |-
          cd clients/apple/build
          rm -rf Payload SFI-mlkem-signed.ipa
          mkdir Payload
          cp -R SFI.xcarchive/Products/Applications/sing-box.app Payload/
          zip -qry SFI-mlkem-signed.ipa Payload
          ls -lh SFI-mlkem-signed.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-mlkem-signed-ipa
          path: clients/apple/build/SFI-mlkem-signed.ipa
          compression-level: 1
