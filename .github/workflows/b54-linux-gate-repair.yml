name: YC b54 Linux gate repair and joint release
on:
  push:
    branches: [integration/b54-smart-logical-provider]
    paths: ['.github/workflows/b54-linux-gate-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  APPLE_SHA: e4cdad7cacdd20f6305bded6c97d673095840949
  SYNC_SHA: 76d01a8bcb7ca253e252cf49c842feb708e79171
  B54_CORE_SHA: 048ec0280668bf2c311bc36888862273c3da429c
  IOS_RUN: "46141980394"
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.11
          cache: false
      - name: Initialize LX dependency forks
        run: git submodule update --init --recursive submodules/utls submodules/wireguard-go submodules/sing-tun submodules/gvisor
      - name: Verify source and production tags
        run: |
          set -euo pipefail
          test "$(cat go.version)" = go1.26.11
          git diff --check 0168f2ae88ab990007068e8e48e300aa40a751cf HEAD
          test -z "$(git status --porcelain)"
          git diff --exit-code "$B54_CORE_SHA" HEAD -- protocol/group/
          tags="$(make -f Makefile.lx -s lx-print-tags)"
          echo "LX_TAGS=$tags" >> "$GITHUB_ENV"
          for tag in with_utls with_lx_chain with_xhttp with_clash_api with_openconnect with_tailscale; do
            echo "$tags" | tr ',' '\n' | grep -Fx "$tag"
          done
      - name: Compile and regression tests
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          go build -ldflags '-checklinkname=0' -tags "$LX_TAGS" ./...
          # Match the previously accepted Darwin fixture isolation. The
          # upstream asynchronous repair worker can change this test's pool
          # while it is asserting a deterministic per-slot counter.
          p=protocol/group/urltest_rr_udp_lx_test.go
          test "$(git hash-object "$p")" = 667247dc318979b37943c5127839080e6b796a2f
          python3 - <<'PY'
          from pathlib import Path
          p=Path("protocol/group/urltest_rr_udp_lx_test.go")
          s=p.read_text()
          old='func TestRRUDP_poolSkipsDeadAndQuarantined(t *testing.T) {\n\tf := newUDPFixture(t, []string{"a", "b", "c", "d"}, []string{"a", "b", "c"})'
          new=old+'\n\tf.s.balancer.heal.holdRound()\n\tdefer f.s.balancer.heal.dropRound()'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff --check -- "$p"
          test "$(git diff --name-only -- "$p")" = "$p"
          go test -race -count=100 -timeout=4m -ldflags '-checklinkname=0' -tags "$LX_TAGS" ./protocol/group/ -run '^TestRRUDP_poolSkipsDeadAndQuarantined$'
          go test -race -count=10 -timeout=3m -ldflags '-checklinkname=0' -tags "$LX_TAGS" ./protocol/group/ -run '^TestB54Priority' -v
          go test -race -count=1 -timeout=12m -ldflags '-checklinkname=0' -tags "$LX_TAGS" ./common/dialer/ ./common/urltest/ ./common/tls/... ./common/badtls/... ./common/ktls/... ./option/ ./route/... ./protocol/group/... ./protocol/vless/ ./protocol/chain/... ./transport/v2rayxhttp/... ./common/finalmask/... ./experimental/libbox/... ./service/oomkiller/... ./protocol/http/... ./protocol/mixed/...
          # The reviewed b50 gate also runs encryption separately: sing-vmess Vision
          # uses unsafe pointer reconstruction which triggers checkptr under -race.
          # Keep the full encryption test suite in the normal production mode.
          go test -count=1 -timeout=8m -ldflags '-checklinkname=0' -tags "$LX_TAGS" ./protocol/vless/encryption/
          git restore --source=HEAD -- "$p"
          git diff --exit-code
      - name: Build Windows amd64 candidate
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -tags "$LX_TAGS" -ldflags "-checklinkname=0 -s -w -X github.com/sagernet/sing-box/constant.Version=1.14.6-lx.37-yc-b54" -o dist/sing-box.exe ./cmd/sing-box
          lib="$(go mod download -json github.com/sagernet/cronet-go/lib/windows_amd64 | python3 -c 'import sys,json; print(json.load(sys.stdin)["Dir"])')"
          dll="$(find "$lib" -name libcronet.dll -print -quit)"
          test -n "$dll"
          cp "$dll" dist/
          (cd dist && sha256sum sing-box.exe libcronet.dll > SHA256SUMS)
          git rev-parse HEAD > dist/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b54-windows-core-retry
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: core
    timeout-minutes: 55
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require successful iOS jobs from exact original run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$IOS_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 || true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IOS_RUN" > ios-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IOS_RUN/jobs" > ios-jobs.json
          python3 - <<'PY'
          import json
          r=json.load(open("ios-run.json"))
          assert r["head_sha"]=="866b76cecbc766ab199b906c24b88ebf2f58bf8a" and r["status"]=="completed",r
          jobs={j["name"]:j["conclusion"] for j in json.load(open("ios-jobs.json"))["jobs"]}
          assert jobs.get("libbox")=="success" and jobs.get("build")=="success",jobs
          PY
      - uses: actions/download-artifact@v4
        with:
          name: b54-upstream-1.14.6-candidate
          run-id: 46141980394
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: b54-windows-core-retry
          path: windows
      - name: Publish verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          (cd windows && sha256sum -c SHA256SUMS && test "$(cat source-commit.txt)" = "$GITHUB_SHA")
          (cd windows && zip -q ../sing-box-b54-windows-amd64.zip sing-box.exe libcronet.dll SHA256SUMS source-commit.txt)
          sha256sum sing-box-b54-windows-amd64.zip > WINDOWS_SHA256SUMS
          tag="candidate-ios-b54-upstream-1.14.6-run-${GITHUB_RUN_ID}"
          gh release create "$tag" SFI-b54-1.14.6-LX37-unsigned.ipa SFI-b54-1.14.6-LX37-portable.ipa b54-signing-tools.zip SHA256SUMS sing-box-b54-windows-amd64.zip WINDOWS_SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "SFI 1.14.9 b54 (sing-box 1.14.6 + LX.37)" --notes "Logical provider candidates in Smart; Apple $APPLE_SHA; verified iOS core and IPA from run $IOS_RUN and Windows core from this repair run; B54 delta $B54_CORE_SHA, upstream sync $SYNC_SHA. XCTest and package preflight passed; physical device acceptance pending."
