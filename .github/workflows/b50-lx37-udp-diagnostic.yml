name: b50 LX.37 UDP fixture isolation
run-name: "LX b50 | UDP Darwin race isolation"
on:
  push:
    branches: [build/b50-lx37-migration]
    paths: [".github/workflows/b50-lx37-udp-diagnostic.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [upstream37, candidate]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: 92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Checkout exact pure LX.37
        if: matrix.source == 'upstream37'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/Leadaxe/sing-box-lx.git refs/tags/v1.14.4-lx.37:refs/lx/upstream37
          test "$(git rev-parse 'refs/lx/upstream37^{commit}')" = 92041d1a1bed6633a153a63d37ccc954f66c2d61
          git checkout --detach 92041d1a1bed6633a153a63d37ccc954f66c2d61
      - name: Verify pinned sources and try exact three-way merge
        if: matrix.source == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          BASE=6cbf8682938577d08f35defb3b11b447fafaa831
          OLD=b5db574026d89c70136cb488a755da6398d6cfc8
          NEW=92041d1a1bed6633a153a63d37ccc954f66c2d61
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- . ':(exclude).github/workflows/b50*' ':(exclude)docs-lx/b50-lx37-review.md' ':(exclude)migration/b50/**'
          test -z "$(git status --porcelain)"
          git fetch --no-tags https://github.com/Leadaxe/sing-box-lx.git \
            refs/tags/v1.14.4-lx.36:refs/lx/upstream36 \
            refs/tags/v1.14.4-lx.37:refs/lx/upstream37
          test "$(git rev-parse 'refs/lx/upstream36^{commit}')" = "$OLD"
          test "$(git rev-parse 'refs/lx/upstream37^{commit}')" = "$NEW"
          git merge-base --is-ancestor "$OLD" "$NEW"
          git diff --binary --full-index "$OLD" "$NEW" -- . ':(exclude).github/workflows/**' > "$RUNNER_TEMP/lx37.patch"
          test -s "$RUNNER_TEMP/lx37.patch"
          set +e
          git apply --3way --index "$RUNNER_TEMP/lx37.patch"
          result=$?
          set -e
          # Apply only the reviewed-resolution overlays for exact conflict blobs.
          # The overlays remain separate until every conflict is resolved.
          for p in box.go common/dialer/resolve.go common/tls/client.go protocol/group/urltest.go protocol/group/urltest_failover_lx.go protocol/group/urltest_penalty_lx.go protocol/group/urltest_selected_lx.go protocol/group/urltest_tick_lx.go; do
            test "$(git rev-parse ":1:$p")" = "$(git rev-parse "$OLD:$p")"
            test "$(git rev-parse ":2:$p")" = "$(git rev-parse "$BASE:$p")"
            test "$(git rev-parse ":3:$p")" = "$(git rev-parse "$NEW:$p")"
            git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt" > "$p"
            cmp "$p" <(git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt")
            gofmt -w "$p"
            cmp "$p" <(git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt" | gofmt)
            git add -- "$p"
            echo "Applied pinned resolution: $p"
          done
          # These two companion changes adapt the clean upstream hooks and b49 guard.
          for p in protocol/group/urltest_hooks_lx.go protocol/group/urltest_guard_lx.go protocol/group/urltest_cycle_lx_test.go; do
            if [ "$p" = protocol/group/urltest_hooks_lx.go ]; then
              test "$(git rev-parse ":$p")" = "$(git rev-parse "$NEW:$p")"
            else
              test "$(git rev-parse ":$p")" = "$(git rev-parse "$BASE:$p")"
            fi
            git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt" > "$p"
            cmp "$p" <(git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt")
            gofmt -w "$p"
            cmp "$p" <(git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt" | gofmt)
            git add -- "$p"
          done
          # RR multi-URL overlays: exact clean LX.37 blobs, not conflict resolutions.
          for p in protocol/group/urltest_rr_queue_lx.go protocol/group/urltest_rr_heal_lx.go protocol/group/urltest_rr_track_lx.go; do
            test "$(git rev-parse ":$p")" = "$(git rev-parse "$NEW:$p")"
            git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt" > "$p"
            cmp "$p" <(git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt")
            gofmt -w "$p"
            cmp "$p" <(git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt" | gofmt)
            git add -- "$p"
          done
          p=protocol/group/urltest_rr_multi_b50_test.go
          test ! -e "$p"
          git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt" > "$p"
          gofmt -w "$p"
          cmp "$p" <(git show "92c0d3ad4a7cfea0ef96f53cc7e0a7e77a886536:migration/b50/resolved/$p.txt" | gofmt)
          git add -- "$p"
          echo "### Source migration preflight" >> "$GITHUB_STEP_SUMMARY"
          printf 'Baseline: %s\nUpstream: %s → %s\nApply exit: %s\n' "$BASE" "$OLD" "$NEW" "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          git status --short
          echo "Unmerged paths:"
          git diff --name-only --diff-filter=U | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Conflict context:"
          git diff --cc --no-ext-diff
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Source integration not yet resolved. No candidate built or published."
            exit 1
          fi
          # Exact upstream documentation blobs contain two known blank lines
          # at EOF. Check their identity, then exempt only those two paths.
          for p in SPECS/TASKS/054-URLTEST_PENALTY_FAILOVER/HISTORY.md SPECS/TASKS/161-HTTP_CONNECT_OUTAGE_LEAK/HISTORY.md; do
            test "$(git rev-parse ":$p")" = "$(git rev-parse "$NEW:$p")"
          done
          git diff --cached --check -- . ':(exclude)SPECS/TASKS/054-URLTEST_PENALTY_FAILOVER/HISTORY.md' ':(exclude)SPECS/TASKS/161-HTTP_CONNECT_OUTAGE_LEAK/HISTORY.md'
          git diff --cached --stat
          echo "Exact source patch and pinned resolutions applied. No publish or push performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Init exact upstream dependency pins
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive submodules/utls submodules/wireguard-go submodules/sing-tun submodules/gvisor
          test "$(git -C submodules/sing-tun rev-parse HEAD)" = 9204da09505e864d98129e8737da71b06926e0bc
          test "$(git -C submodules/wireguard-go rev-parse HEAD)" = e587a0f47cfe9b103f134437ebe9a6751677265b
          test "$(git -C submodules/utls rev-parse HEAD)" = 5b1d579d14864b13e142c3567ddfd4fcd320bf57
          test "$(git -C submodules/gvisor rev-parse HEAD)" = 117243aa02fa2915cb53d1d4549bfca3a3ebf238
      - name: Reproduce exact upstream UDP test without production tags
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=100 -timeout=4m ./protocol/group -run '^TestRRUDP_poolSkipsDeadAndQuarantined$' -v
      - name: Diagnostic fixture with background repair held
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("protocol/group/urltest_rr_udp_lx_test.go")
          s=p.read_text()
          old='func TestRRUDP_poolSkipsDeadAndQuarantined(t *testing.T) {\n\tf := newUDPFixture(t, []string{"a", "b", "c", "d"}, []string{"a", "b", "c"})'
          new=old+'\n\tf.s.balancer.heal.holdRound()\n\tdefer f.s.balancer.heal.dropRound()'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff -- protocol/group/urltest_rr_udp_lx_test.go
          go test -race -count=100 -timeout=4m ./protocol/group -run '^TestRRUDP_poolSkipsDeadAndQuarantined$' -v
