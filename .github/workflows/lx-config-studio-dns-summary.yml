name: SFI LX Config Studio 1.3.1 DNS Summary unsigned IPA
run-name: "LX iOS | Config Studio 1.3.1 DNS Summary | 1.14.9 (build 18) | unsigned IPA"

on:
  push:
    branches:
      - ci/config-studio-dns-summary-1.3.1
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest iOS IPA build per branch. Branch-scoped groups prevent
# a manual dispatch on the default branch cancelling feature-branch builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Libbox + SFI unsigned IPA (LX)
    runs-on: xcode-27
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout (LX sources, no submodules yet)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Init submodules (Apple client pinned to current LX features)
        run: |-
          git config submodule.clients/apple.url https://github.com/eliassmail-dotcom/sing-box-for-apple.git
          git submodule update --init --recursive
          git -C clients/apple fetch --no-tags origin feature/config-studio-dns-summary-1.3.1
          git -C clients/apple checkout --detach 2508f14a41615572be71b36325b8f434554ea91c
          test "$(git -C clients/apple rev-parse HEAD)" = "2508f14a41615572be71b36325b8f434554ea91c"
          git -C clients/apple submodule update --init --recursive
          git -C clients/apple rev-parse HEAD

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false

      - name: Patch Go for iOS
        run: .github/patch_go_for_ios.sh

      - name: Test LX adaptive health and Smart base-white priority
        run: |-
          go test ./protocol/group -run '^(TestLX|TestPriorityFallback_)' -count=1 -timeout=8m
          go test -race ./protocol/group -run '^(TestPriorityFallback_SelectedOutboundReadWriteRace)

      - name: Build Libbox.xcframework (ios/arm64 + simulator, with_clash_api via integration patch)
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          git tag v1.14.4-lx.33 -f
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64,iossimulator/arm64
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/Libbox.xcframework

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Dump CommandClientHandler protocol (diagnostic)
        run: |-
          grep -n -B2 -A20 'Protocol LibboxCommandClientHandlerProtocol' clients/apple/Libbox.xcframework/ios-arm64/Libbox.framework/Headers/Libbox.h || \
            grep -n -A20 'LibboxCommandClientHandlerProtocol' clients/apple/Libbox.xcframework/ios-arm64/Libbox.framework/Headers/Libbox.h | head -60

      - name: Resolve Swift packages into isolated build directory
        run: |
          cd clients/apple
          mkdir -p build/SourcePackages
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -scheme SFI -clonedSourcePackagesDirPath "$PWD/build/SourcePackages"; then
              exit 0
            fi
            echo "SwiftPM resolve attempt $attempt failed; retrying isolated checkout"
            sleep 5
          done
          exit 1

      - name: Run SFUnitTests (iOS simulator)
        run: |-
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for dev in d['devices'].values():
              for x in dev:
                  if x['isAvailable'] and x['name'].startswith('iPhone'):
                      print(x['name']); raise SystemExit
          sys.exit(1)
          ")
          echo "Using simulator: $SIM"
          cd clients/apple
          set +e
          rm -rf build/LXTests.xcresult
          xcodebuild test -skipPackagePluginValidation \
            -resultBundlePath "$PWD/build/LXTests.xcresult" \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -scheme SFI -configuration Debug \
            -only-testing:SFUnitTests \
            -destination "platform=iOS Simulator,name=$SIM" \
            CODE_SIGN_IDENTITY=-
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "--- XCTest summary ---"
            xcrun xcresulttool get test-results summary --path build/LXTests.xcresult || true
            echo "--- XCTest test failures ---"
            xcrun xcresulttool get test-results tests --path build/LXTests.xcresult || true
            echo "--- recent simulator crash reports ---"
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do
              echo "=== $f"
              head -c 3000 "$f"
              echo
            done
          fi
          exit $STATUS


      - name: Upload XCTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SFI-lx-test-results
          path: clients/apple/build/LXTests.xcresult
          retention-days: 3
          compression-level: 1

      - name: Archive SFI (unsigned)
        run: |-
          cd clients/apple
          rm -rf build/SFI.xcarchive
          xcodebuild archive -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -scheme SFI -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA (for GBox signing)
        run: |-
          cd clients/apple/build
          rm -rf Payload SFI-lxpp-v1.14.9-b18-ConfigStudio-DNS-Summary-unsigned.ipa
          mkdir Payload
          cp -R SFI.xcarchive/Products/Applications/sing-box.app Payload/
          APP_INFO="Payload/sing-box.app/Info.plist"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")
          test "$APP_VERSION" = "1.14.9"
          test "$APP_BUILD" = "18"
          echo "Packaging sing-box lx++ $APP_VERSION ($APP_BUILD)"
          zip -qry SFI-lxpp-v1.14.9-b18-ConfigStudio-DNS-Summary-unsigned.ipa Payload
          ls -lh SFI-lxpp-v1.14.9-b18-ConfigStudio-DNS-Summary-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-lxpp-v1.14.9-b18-ConfigStudio-DNS-Summary-unsigned-ipa
          path: clients/apple/build/SFI-lxpp-v1.14.9-b18-ConfigStudio-DNS-Summary-unsigned.ipa
          compression-level: 1
 -count=1 -timeout=8m

      - name: Build Libbox.xcframework (ios/arm64 + simulator, with_clash_api via integration patch)
        run: |-
